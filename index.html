<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maa Durga - Pencil Drawing, Coloring and 3D</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif;color:#ffe3a0}
  body{display:flex;align-items:center;justify-content:center}
  canvas{display:block}
  #ui{display:none;position:fixed;left:10px;top:10px;gap:8px;flex-wrap:wrap;align-items:center;
      background:rgba(0,0,0,.6);padding:8px 10px;border-radius:10px;font-size:13px;z-index:5;
      border:1px solid rgba(255,200,100,.25);backdrop-filter:blur(4px);max-width:calc(100vw - 40px)}
  #ui button,#ui label.btn{background:#7a1a12;color:#ffe3a0;border:1px solid #d9a441;border-radius:6px;
      padding:6px 10px;cursor:pointer;font-size:13px}
  #ui button:hover,#ui label.btn:hover{background:#a02418}
  #ui select{background:#2a0d0a;color:#ffe3a0;border:1px solid #d9a441;border-radius:6px;padding:4px}
  #status{opacity:.9;min-width:170px}
  #ui input[type=range]{width:90px;vertical-align:middle}
  #file{display:none}
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="ui">
  <label class="btn" for="file">Choose picture(s)</label>
  <input id="file" type="file" accept="image/*" multiple>
  <button id="replay">Replay</button>
  <button id="pick">Pick start point (face)</button>
  <button id="next">Next picture</button>
  <span>Look
    <select id="final">
      <option value="real">Realistic colors</option>
      <option value="cartoon">Cartoon colors + bold lines</option>
    </select>
  </span>
  <span>3D <input id="depthAmt" type="range" min="0" max="2" step="0.05" value="1"></span>
  <span id="status">Loading...</span>
</div>

<script>
/* =====================================================================
   PENCIL DRAWING  ->  PENCIL COLORING  ->  REAL 3D DEPTH
   - A real pencil starts from the FACE and draws thick bold lines,
     place by place (face, crown, hair, arms, weapons, body, lion ...).
   - Then a colored pencil colors one place at a time, in the same order.
   - At the end the picture becomes realistic and moves in 3D.
   Your Durga picture is already inside this file. Use "Choose picture(s)"
   (or drag & drop) for the Durga family picture, and "Pick start point"
   to tell the pencil where the face is in a new picture.
   ===================================================================== */

const PAINT_SECONDS = 55;    // how long the coloring takes (bigger = slower)

const EDGE_FRACTION = 0.04;  // amount of lines (bigger = more lines)
const LINE_BOLDNESS = 1.0;   // thickness of the black pencil lines (try 0.6 ... 1.8)
// ---------------------------------------------

   ===================================================================== */

let mx = 0, my = 0;

let pickMode = false;

// painting state

/* ---------- a real-looking pencil ---------- */
function drawPencil(x, y, body, tip) {
  const s = Math.max(W, H) / 800;
  sctx.save();
  sctx.translate(x, y); sctx.rotate(0.6); sctx.scale(s, s);
  sctx.shadowColor = 'rgba(0,0,0,0.45)'; sctx.shadowBlur = 8; sctx.shadowOffsetX = 5; sctx.shadowOffsetY = 6;
  sctx.fillStyle = '#e9c48e';
  sctx.beginPath(); sctx.moveTo(0, 0); sctx.lineTo(-7, -24); sctx.lineTo(7, -24); sctx.closePath(); sctx.fill();
  sctx.shadowColor = 'transparent';
  sctx.fillStyle = tip;
  sctx.beginPath(); sctx.moveTo(0, 0); sctx.lineTo(-2.8, -9); sctx.lineTo(2.8, -9); sctx.closePath(); sctx.fill();
  sctx.fillStyle = body; sctx.fillRect(-7, -105, 14, 81);
  sctx.fillStyle = 'rgba(255,255,255,0.28)'; sctx.fillRect(-7, -105, 4, 81);
  sctx.fillStyle = 'rgba(0,0,0,0.22)'; sctx.fillRect(3, -105, 4, 81);
  sctx.fillStyle = '#b9bcc4'; sctx.fillRect(-7, -117, 14, 12);
  sctx.fillStyle = '#e8788a'; sctx.beginPath(); sctx.roundRect ? sctx.roundRect(-7, -129, 14, 12, 3) : sctx.rect(-7, -129, 14, 12); sctx.fill();
  sctx.restore();
}

function drawCaption() {
  const size = Math.max(28, Math.round(W * 0.075));
  sctx.save();
  sctx.textAlign = 'center';
  sctx.textBaseline = 'top';
  sctx.font = `bold ${size}px "Nirmala UI", "Noto Sans Bengali", sans-serif`;
  sctx.lineJoin = 'round';
  sctx.lineWidth = Math.max(3, size * 0.09);
  sctx.strokeStyle = 'rgba(45, 20, 13, 0.9)';
  sctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
  sctx.shadowBlur = size * 0.2;
  sctx.shadowOffsetY = size * 0.06;
  sctx.strokeText('জয় মা দুর্গা', W / 2, H * 0.035);
  sctx.shadowColor = 'transparent';
  sctx.globalAlpha = 0.38;
  sctx.strokeStyle = '#b7782a';
  sctx.lineWidth = Math.max(1, size * 0.035);
  sctx.strokeText('জয় মা দুর্গা', W / 2 + 1, H * 0.035 - 1);
  sctx.globalAlpha = 1;
  sctx.fillStyle = '#ffe5a3';
  sctx.fillText('জয় মা দুর্গা', W / 2, H * 0.035);
  sctx.restore();
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function frame(now) {
  requestAnimationFrame(frame);
  if (!stage) return;
  const dt = Math.min(0.05, (now - (lastNow || now)) / 1000); lastNow = now;
  const el = (now - phaseStart) / 1000;
  let amt = 0, finalMix = 0;

  if (phase === 'sketch') {
    const remainSeeds = Math.max(0, strongCount - visitedStrong);
    const sps = Math.max(0.5, newCount / stepCount);
    const timeLeft = Math.max(0.6, DRAW_SECONDS - el);
    let rate = (remainSeeds / sps) / timeLeft;
    rate = clamp(rate, 25, 25000);
    let steps = Math.min(600, Math.max(1, Math.round(rate * dt)));
    visitedStrong = Math.min(strongCount, newCount);
    let guard = 0;
    while (steps > 0 && !drawDone && guard++ < 30000) {
      if (!pen.active && !startStroke()) { finishRegionDraw(); continue; }
      stepPen(); steps--;
    }
    statusEl.textContent = 'Drawing with pencil... place ' + Math.min(drawIdx + 1, order.length) + ' / ' + order.length;
    if (drawDone || el > DRAW_SECONDS * 2) { phase = 'sketchFinish'; phaseStart = now; }
  } else if (phase === 'sketchFinish') {
    rctx.globalAlpha = 0.08; rctx.fillStyle = '#fff'; rctx.fillRect(0, 0, W, H); rctx.globalAlpha = 1;
    statusEl.textContent = 'Drawing complete';
    if (el > 1.6) { rctx.fillRect(0, 0, W, H); phase = 'paint'; phaseStart = now; }
  } else if (phase === 'paint') {
    const done = advanceHatch(paintSpeed * dt);
    statusEl.textContent = 'Coloring with pencil... place ' + Math.min(pIdx + 1, order.length) + ' / ' + order.length;
    if (done || el > PAINT_SECONDS * 2) { phase = 'paintFinish'; phaseStart = now; }
  } else if (phase === 'paintFinish') {
    cctx.globalAlpha = 0.07; cctx.fillStyle = '#fff'; cctx.fillRect(0, 0, W, H); cctx.globalAlpha = 1;
    statusEl.textContent = 'Final touches...';
    if (el > 1.8) { cctx.fillRect(0, 0, W, H); phase = 'live'; phaseStart = now; }
  } else {
    amt = smooth(clamp((el - 0.5) / 3, 0, 1));
    finalMix = 0;
    statusEl.textContent = pickMode ? 'Click on the face...' : 'Move mouse for 3D';
  }
  if (pickMode && phase !== 'live') statusEl.textContent = 'Click on the face...';

  /* ---- compose the frame ---- */
  sctx.fillStyle = `rgb(${paperRGB})`; sctx.fillRect(0, 0, W, H);
  // soft pencil shading
  t1ctx.globalCompositeOperation = 'source-over'; t1ctx.clearRect(0, 0, W, H);
  t1ctx.drawImage(sketchCv, 0, 0);
  t1ctx.globalCompositeOperation = 'destination-in'; t1ctx.drawImage(revealCv, 0, 0);
  sctx.drawImage(tmp1, 0, 0);
  // coloured by pencil
  if (phase === 'paint' || phase === 'paintFinish' || phase === 'live') {
    t2ctx.globalCompositeOperation = 'source-over'; t2ctx.clearRect(0, 0, W, H);
    t2ctx.drawImage(finalSel.value === 'cartoon' ? cartoCv : imgCv, 0, 0);
    t2ctx.globalCompositeOperation = 'destination-in'; t2ctx.drawImage(colorCv, 0, 0);
    sctx.drawImage(tmp2, 0, 0);
  }
  // thick black pencil lines
  t3ctx.globalCompositeOperation = 'source-over'; t3ctx.clearRect(0, 0, W, H);
  t3ctx.drawImage(inkCv, 0, 0);
  t3ctx.globalCompositeOperation = 'destination-in'; t3ctx.drawImage(revealCv, 0, 0);
  if (finalSel.value !== 'cartoon') {
    t3ctx.globalCompositeOperation = 'destination-out'; t3ctx.globalAlpha = 0.88; t3ctx.drawImage(colorCv, 0, 0); t3ctx.globalAlpha = 1;
  }
  sctx.drawImage(tmp3, 0, 0);

  // pencils
  if (phase === 'sketch' && !drawDone) drawPencil(pen.x, pen.y, '#f2b01e', '#262626');
  if (phase === 'paint' && ptip) {
    const c = regions[order[Math.min(pIdx, order.length - 1)]].rgb;
    const col = `rgb(${Math.min(255, c[0] + 25)},${Math.min(255, c[1] + 25)},${Math.min(255, c[2] + 25)})`;
    drawPencil(ptip[0], ptip[1], col, `rgb(${c[0]},${c[1]},${c[2]})`);
  }
  // embers
  if (phase === 'paintFinish' || phase === 'live') {
    const a = phase === 'live' ? 1 : clamp(el / 1.8, 0, 1);
    sctx.save(); sctx.globalCompositeOperation = 'lighter';
    embers.forEach(e => {
      e.y -= e.v * dt; if (e.y < -10) { e.y = H + 10; e.x = Math.random() * W; }
      sctx.globalAlpha = a * (0.35 + 0.35 * Math.sin(now / 350 + e.ph));
      sctx.fillStyle = '#ffa43a'; sctx.shadowColor = '#ff7a10'; sctx.shadowBlur = 8;
      sctx.beginPath(); sctx.arc(e.x + Math.sin(now / 900 + e.ph) * 8, e.y, e.r, 0, 6.283); sctx.fill();
    });
    sctx.restore();
  }

  drawCaption();

  /* ---- send to GL with depth parallax ---- */
  const t = now / 1000;
  const tx = pointer.active ? pointer.x : Math.sin(t * 0.55) * 0.7;
  const ty = pointer.active ? pointer.y : Math.cos(t * 0.42) * 0.35;
  mx += (tx - mx) * 0.06; my += (ty - my) * 0.06;
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texImg);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, stage);
  gl.uniform2f(uOff, mx, -my);
  gl.uniform1f(uAmt, amt * parseFloat(depthSlider.value));
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* =====================================================================
   UI
   ===================================================================== */
let queue = [{ src: DEFAULT_SRC, isDefault: true }], qi = 0;
function loadImage(item) {
  statusEl.textContent = 'Preparing picture...';
  startNorm = item.isDefault ? DEFAULT_START.slice() : [0.5, 0.33];
  const img = new Image();
  img.onload = () => { setTimeout(() => prepare(img), 30); };
  img.onerror = () => { statusEl.textContent = 'Could not load this picture'; };
  img.src = item.src;
}
function setFiles(files) {
  const arr = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!arr.length) return;
  queue = arr.map(f => ({ src: URL.createObjectURL(f), isDefault: false })); qi = 0; loadImage(queue[0]);
}
document.getElementById('file').addEventListener('change', e => setFiles(e.target.files));
document.getElementById('replay').addEventListener('click', () => stage && restart());
document.getElementById('next').addEventListener('click', nextPic);
document.getElementById('pick').addEventListener('click', () => { pickMode = true; view.style.cursor = 'crosshair'; });
function nextPic() { qi = (qi + 1) % queue.length; loadImage(queue[qi]); }
view.addEventListener('click', e => {
  if (!pickMode || !stage) return;
  const r = view.getBoundingClientRect();
  const nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height;
  startNorm = [clamp((nx - 0.5) / 1.06 + 0.5, 0, 1), clamp((ny - 0.5) / 1.06 + 0.5, 0, 1)];
  pickMode = false; view.style.cursor = 'default';
  restart();
});
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); setFiles(e.dataTransfer.files); });
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') stage && restart();
  if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') nextPic();
});
function setPointer(cx, cy) {
  const r = view.getBoundingClientRect();
  pointer.x = clamp(((cx - r.left) / r.width - 0.5) * 2, -1, 1);
  pointer.y = clamp(((cy - r.top) / r.height - 0.5) * 2, -1, 1);
  pointer.active = true;
}
addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
addEventListener('touchmove', e => setPointer(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
addEventListener('touchend', () => pointer.active = false);
document.documentElement.addEventListener('mouseleave', () => pointer.active = false);

function fitCanvas() {
  if (!W) return;
  const s = Math.min(innerWidth / W, innerHeight / H);
  view.style.width = Math.floor(W * s) + 'px';
  view.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fitCanvas);

loadImage(queue[0]);
requestAnimationFrame(frame);
</script>
</body>
</html>
